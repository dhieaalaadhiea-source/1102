<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS4 Jailbreak</title>
  <link rel="stylesheet" href="includes/style.css">
  <style>
    /* إضافة تنسيقات CSS داخلية سريعة هنا لتعكس "التعديلات اللطيفة" */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f2f5; /* خلفية هادئة وجذابة */
      direction: rtl; /* اتجاه النص العربي */
    }

    .site-header {
      background-color: #fff;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .header-content {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .header-logo {
      height: 60px; /* ضبط حجم الشعار */
    }

    .header-titles h2, .header-titles h3 {
      margin: 0;
      color: #333;
    }

    main {
      padding: 30px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    h3#UA {
      text-align: center;
      color: #7f8c8d;
      font-weight: normal;
      margin-top: 0;
    }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }

    .btn-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      margin-bottom: 25px;
    }

    #kernel-options {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      justify-content: center;
    }

    #jeilbrek {
      background-color: #e67e22; /* لون برتقالي مميز ولطيف */
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: background-color 0.3s;
    }

    #jeilbrek:hover {
      background-color: #d35400;
    }

    .autoJb {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
    }

    .media-box {
      background-color: #fff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    #console {
      background-color: #000;
      color: #0f0; /* نص أخضر على خلفية سوداء لوحدة التحكم */
      padding: 20px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.95em;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
      overflow-x: auto;
      white-space: pre-wrap; /* للسماح بالتفاف النص */
    }
  </style>
</head>
<body>

  <!-- إضافة شريط الرأس مع الشعار والتعديلات اللطيفة -->
  <header class="site-header">
    <div class="header-content">
      <img src="includes/NABEEL LOGO.jpg" alt="Nabil's Logo" class="header-logo">
      <div class="header-titles">
        <h2>مكتب نبيل</h2>
        <h3>Nabil's Office</h3>
      </div>
    </div>
  </header>

    <h3 id="UA">Running on:</h3>

    <hr>

    <div class="btn-container">
      <form id="kernel-options">
        <label> Kernel:</label>
        <div class="radio-option">
          <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
          <label for="netctrl-exploit">NetCtrl</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
          <label for="lapse-exploit">Lapse</label>
        </div>
      </form>
      <button id="jeilbrek">Jeilbrek</button>
      <div class="autoJb">
        <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
        <input class="mt-2" id="autoJbInput" type="checkbox">
      </div>
    </div>

 

      <pre id="console">Ready. Awaiting execution...
      </pre>
    </div>


   <script src="src/main.js"></script>
   <script src="includes/script.js"></script>
</body>
</html>
